name: Monthly Database Backup

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  database-backup:
    name: Supabase PostgreSQL Backup
    runs-on: ubuntu-latest

    steps:
      - name: Validate Supabase Database Secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not configured in this repository."
            echo "Please go to: Repository Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name: SUPABASE_DB_URL"
            echo "Value: postgresql://postgres:[YOUR-PASSWORD]@[YOUR-HOST]:5432/postgres"
            exit 1
          fi

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Generate Database Dump
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +"%Y-%m-%d_%H%M%S")
          FILENAME="deepini-backup-${TIMESTAMP}.sql.gz"
          
          echo "Starting database dump to ${FILENAME}..."
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            --encoding=UTF8 | gzip > "backups/${FILENAME}"

          FILESIZE=$(du -h "backups/${FILENAME}" | cut -f1)
          echo "Backup generated successfully. Size: ${FILESIZE}"
          
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV
          echo "BACKUP_TAG=backup-$(date +"%Y-%m-%d")" >> $GITHUB_ENV
          echo "BACKUP_DATE=$(date +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_ENV
          echo "BACKUP_SIZE=${FILESIZE}" >> $GITHUB_ENV

      - name: Upload Backup as Workflow Artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: backups/${{ env.BACKUP_FILE }}
          retention-days: 90

      - name: Create Permanent GitHub Release Tag
        uses: softprops/action-gh-release@v2
        if: env.BACKUP_TAG != ''
        with:
          tag_name: ${{ env.BACKUP_TAG }}
          name: "Database Backup (${{ env.BACKUP_DATE }})"
          body: |
            Automated monthly snapshot of Deepini Supabase database.
            
            - **Timestamp**: ${{ env.BACKUP_DATE }}
            - **Filename**: `${{ env.BACKUP_FILE }}`
            - **Size**: ${{ env.BACKUP_SIZE }}
            
            ### How to Restore:
            ```bash
            gunzip -c ${{ env.BACKUP_FILE }} | psql "postgresql://postgres:[PASSWORD]@[HOST]:5432/postgres"
            ```
          files: backups/${{ env.BACKUP_FILE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
